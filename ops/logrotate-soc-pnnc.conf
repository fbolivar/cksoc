# Rotacion de logs del SOC PNNC (backend + PM2).
# copytruncate: PM2/pino mantienen el archivo abierto; se copia y trunca en
# sitio sin necesidad de reiniciar el proceso.
/home/soporte/.pm2/logs/*.log /home/soporte/soc-pnnc-dashboard/backend/logs/*.log {
    daily
    rotate 14
    maxsize 10M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su soporte soporte
}
