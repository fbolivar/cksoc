<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-pnnc.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <!-- Tema (claro/oscuro) aplicado antes del primer paint para evitar parpadeo.
         Por defecto: modo oscuro "SOC". -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('soc-theme');
          document.documentElement.classList.toggle('dark', t !== 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>SOC PNNC · Centro de Operaciones de Seguridad</title>
    <!-- Tipografia principal PNNC: Nunito Sans (Manual de Identidad Visual) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
