<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-pnnc.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f3" />
    <!-- Modo OSCURO forzado (HUD táctico): siempre oscuro en cada carga,
         ignorando cualquier preferencia guardada. El toggle sigue funcionando
         durante la sesión, pero al recargar vuelve a oscuro. -->
    <script>
      (function () {
        document.documentElement.classList.add('dark');
      })();
    </script>
    <title>HexWatch · Centro de Operaciones de Seguridad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
